<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 220" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070a10" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <pattern id="pixelGrid" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="1" height="1" fill="#334155" opacity="0.3" />
    </pattern>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="920" height="220" rx="10" fill="url(#bgGrad)" />
  <rect width="920" height="220" rx="10" fill="url(#pixelGrid)" />
  <rect x="1" y="1" width="918" height="218" rx="9" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <!-- Pixel Icon Container (Left) -->
  <g transform="translate(42, 34)" shape-rendering="crispEdges">
    <!-- Antigravity Gravitational Ring (Pixelated Orbit) -->
    <rect x="24" y="18" width="6" height="6" fill="#6366f1" opacity="0.6" />
    <rect x="18" y="24" width="6" height="6" fill="#6366f1" opacity="0.8" />
    <rect x="12" y="36" width="6" height="6" fill="#818cf8" />
    <rect x="6" y="54" width="6" height="12" fill="#a855f7" />
    <rect x="12" y="78" width="6" height="6" fill="#818cf8" />
    <rect x="18" y="90" width="6" height="6" fill="#6366f1" opacity="0.8" />
    <rect x="24" y="96" width="6" height="6" fill="#6366f1" opacity="0.6" />

    <rect x="108" y="18" width="6" height="6" fill="#6366f1" opacity="0.6" />
    <rect x="114" y="24" width="6" height="6" fill="#6366f1" opacity="0.8" />
    <rect x="120" y="36" width="6" height="6" fill="#818cf8" />
    <rect x="126" y="54" width="6" height="12" fill="#a855f7" />
    <rect x="120" y="78" width="6" height="6" fill="#818cf8" />
    <rect x="114" y="90" width="6" height="6" fill="#6366f1" opacity="0.8" />
    <rect x="108" y="96" width="6" height="6" fill="#6366f1" opacity="0.6" />

    <!-- Telegram Pixel Plane (Crisp Pixel Matrix) -->
    <!-- Nose / Tip -->
    <rect x="96" y="12" width="6" height="6" fill="#00f2fe" />
    <rect x="90" y="18" width="12" height="6" fill="#38bdf8" />
    <rect x="84" y="24" width="18" height="6" fill="#38bdf8" />
    <rect x="78" y="30" width="24" height="6" fill="#38bdf8" />
    <!-- Upper Body & Wing Sweep -->
    <rect x="72" y="36" width="6" height="6" fill="#0284c7" />
    <rect x="78" y="36" width="30" height="6" fill="#38bdf8" />
    <rect x="66" y="42" width="6" height="6" fill="#0284c7" />
    <rect x="72" y="42" width="36" height="6" fill="#38bdf8" />
    <rect x="60" y="48" width="6" height="6" fill="#0284c7" />
    <rect x="66" y="48" width="12" height="6" fill="#bae6fd" />
    <rect x="78" y="48" width="30" height="6" fill="#38bdf8" />
    <!-- Center Crease & Inner Fold -->
    <rect x="54" y="54" width="6" height="6" fill="#0284c7" />
    <rect x="60" y="54" width="18" height="6" fill="#ffffff" />
    <rect x="78" y="54" width="30" height="6" fill="#38bdf8" />
    <rect x="48" y="60" width="6" height="6" fill="#0284c7" />
    <rect x="54" y="60" width="24" height="6" fill="#ffffff" />
    <rect x="78" y="60" width="24" height="6" fill="#38bdf8" />
    <!-- Lower Body / Trailing Flap -->
    <rect x="42" y="66" width="6" height="6" fill="#0284c7" />
    <rect x="48" y="66" width="18" height="6" fill="#93c5fd" />
    <rect x="66" y="66" width="12" height="6" fill="#ffffff" />
    <rect x="78" y="66" width="18" height="6" fill="#38bdf8" />
    <rect x="36" y="72" width="6" height="6" fill="#0284c7" />
    <rect x="42" y="72" width="12" height="6" fill="#93c5fd" />
    <rect x="54" y="72" width="18" height="6" fill="#0284c7" />
    <rect x="72" y="72" width="12" height="6" fill="#38bdf8" />
    <!-- Keel & Rudder Base -->
    <rect x="30" y="78" width="6" height="6" fill="#0284c7" />
    <rect x="48" y="78" width="12" height="6" fill="#0284c7" />
    <rect x="24" y="84" width="6" height="6" fill="#0284c7" />
    <rect x="48" y="84" width="6" height="6" fill="#0284c7" />

    <!-- Pulse Dots / Floating Pixels -->
    <rect x="66" y="108" width="6" height="6" fill="#38bdf8" opacity="0.9" />
    <rect x="78" y="114" width="6" height="6" fill="#a855f7" opacity="0.7" />
    <rect x="54" y="114" width="6" height="6" fill="#00f2fe" opacity="0.5" />
  </g>

  <!-- Typography & Pixel Header (Right) -->
  <g transform="translate(205, 34)">
    <!-- Pixel Text "AGY" -->
    <g fill="url(#cyanGrad)" shape-rendering="crispEdges">
      <!-- Letter A -->
      <rect x="0" y="16" width="8" height="48" />
      <rect x="8" y="8" width="24" height="8" />
      <rect x="32" y="16" width="8" height="48" />
      <rect x="8" y="32" width="24" height="8" />

      <!-- Letter G -->
      <rect x="52" y="8" width="36" height="8" />
      <rect x="44" y="16" width="8" height="40" />
      <rect x="52" y="56" width="36" height="8" />
      <rect x="80" y="36" width="8" height="20" />
      <rect x="68" y="36" width="12" height="8" />

      <!-- Letter Y -->
      <rect x="96" y="8" width="8" height="24" />
      <rect x="124" y="8" width="8" height="24" />
      <rect x="104" y="32" width="20" height="8" />
      <rect x="110" y="40" width="8" height="24" />
    </g>

    <!-- Pixel "X" Separator -->
    <g transform="translate(156, 12)" fill="url(#crossGrad)" shape-rendering="crispEdges">
      <rect x="0" y="4" width="8" height="8" />
      <rect x="24" y="4" width="8" height="8" />
      <rect x="6" y="12" width="8" height="8" />
      <rect x="18" y="12" width="8" height="8" />
      <rect x="12" y="20" width="8" height="12" />
      <rect x="6" y="32" width="8" height="8" />
      <rect x="18" y="32" width="8" height="8" />
      <rect x="0" y="40" width="8" height="8" />
      <rect x="24" y="40" width="8" height="8" />
    </g>

    <!-- Pixel Text "TELE" -->
    <g transform="translate(208, 0)" fill="url(#purpleGrad)" shape-rendering="crispEdges">
      <!-- Letter T -->
      <rect x="0" y="8" width="36" height="8" />
      <rect x="14" y="16" width="8" height="48" />

      <!-- Letter E -->
      <rect x="44" y="8" width="8" height="56" />
      <rect x="52" y="8" width="28" height="8" />
      <rect x="52" y="32" width="20" height="8" />
      <rect x="52" y="56" width="28" height="8" />

      <!-- Letter L -->
      <rect x="88" y="8" width="8" height="56" />
      <rect x="96" y="56" width="28" height="8" />

      <!-- Letter E -->
      <rect x="132" y="8" width="8" height="56" />
      <rect x="140" y="8" width="28" height="8" />
      <rect x="140" y="32" width="20" height="8" />
      <rect x="140" y="56" width="28" height="8" />
    </g>

    <!-- Subtitle & Technical Spec Strings -->
    <text x="0" y="98" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="14.5" font-weight="700" letter-spacing="2" fill="#e2e8f0">
      ASYNC TELEGRAM BRIDGE FOR GOOGLE ANTIGRAVITY CLI
    </text>

    <!-- Meta Pills (Pixel Frames) -->
    <g transform="translate(0, 118)" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" letter-spacing="1">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="138" height="24" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="14" y="16" fill="#38bdf8">100% PYTHON</text>

      <!-- Pill 2 -->
      <rect x="148" y="0" width="156" height="24" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="162" y="16" fill="#4ade80">0 DEPENDENCIES</text>

      <!-- Pill 3 -->
      <rect x="314" y="0" width="176" height="24" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="328" y="16" fill="#c084fc">STREAM-JSON NDJSON</text>

      <!-- Pill 4 -->
      <rect x="500" y="0" width="168" height="24" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="514" y="16" fill="#facc15">PORT 9877 SECURE</text>
    </g>
  </g>
</svg>